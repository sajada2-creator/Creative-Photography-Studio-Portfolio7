kind = "web"
previewPath = "/"
title = "Creative Photography Studio Portfolio"
description = "A cinematic Arabic RTL portfolio website for a premium photography and visual production studio, with immersive project browsing, category galleries, lightbox viewing, and social contact links."
version = "1.0.0"
id = "artifacts/studio-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25338

[services.development]
run = "pnpm --filter @workspace/studio-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/studio-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/studio-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25338"
BASE_PATH = "/"
